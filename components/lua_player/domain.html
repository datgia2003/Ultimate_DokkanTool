<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Domain preview</title>
  <script src="vendor/lwf.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #080e16; color: #dce6f1; font: 13px system-ui; }
    body { display: flex; flex-direction: column; }
    #viewport { width: 100%; height: 100%; min-height: 0; position: relative; overflow: hidden; }
    #stage { position: absolute; width: 852px; height: 1536px; transform-origin: top left; }
    footer { display: flex; gap: 10px; align-items: center; padding: 10px; border-top: 1px solid #253040; }
    button { background: #14282b; color: #a9ebe0; border: 1px solid #32615d; border-radius: 7px; padding: 7px 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { color: #aab8c8; font-size: 12px; }
  </style>
</head>
<body>
  <div id="viewport"><div id="stage"></div></div>
  <script type="module" src="js/domain-preview.js?v=4"></script>
</body>
</html>
